services:
  db:
    image: postgres:15
    container_name: ledger
    restart: unless-stopped
    env_file:
      - .env

    ports:
      - "5001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    